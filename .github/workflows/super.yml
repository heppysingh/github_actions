name: Super Extraction

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl tar 

      - name: Download firmware
        run: |
          curl -L -o firmware.tgz "https://xm04."
      - name: Extract Firmware
        run: |
          tar -xvf firmware.tgz
      - name: Compress super
        run: |
          xz -T0 -9 -k tornado_global_images_OS2.0.206.0.VPOMIXM_15.0/images/super.img
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: super-image
          path: tornado_global_images_OS2.0.206.0.VPOMIXM_15.0/images/super.img.xz
